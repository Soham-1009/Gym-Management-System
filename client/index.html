    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Production MERN Gym Management System - Complete membership, attendance, trainer, workout, and billing software with role-based access control." />
    <meta name="author" content="SDLC Software Engineering Team" />
    <title>TitanPulse Gym Management System</title>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('titanpulse_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            if (!saved) localStorage.setItem('titanpulse_theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-50 text-zinc-900 dark:bg-[#09090b] dark:text-zinc-100 font-sans antialiased selection:bg-indigo-500/20 selection:text-indigo-600 dark:selection:text-indigo-300 min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
